<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - מחולל קבלות</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; direction: rtl; }
        .login-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px; width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 28px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #555; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.12); }
        .btn { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn:hover { background: #2980b9; }
        .link { text-align: center; margin-top: 16px; font-size: 14px; }
        .link a { color: #3498db; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; background: #fadbd8; color: #c0392b; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>מחולל קבלות</h1>
        <p class="subtitle">התחבר לחשבון שלך</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label>שם משתמש</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>סיסמה</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">התחבר</button>
        </form>
        <p class="link">אין לך חשבון? <a href="{{ url_for('register') }}">הרשם כאן</a></p>
    </div>
</body>
</html>
