{% extends "base.html" %}
{% block title %}לקוחות{% endblock %}

{% block content %}
<div class="card">
    <h2>הוספת לקוח חדש</h2>
    <form method="POST" action="{{ url_for('add_client') }}">
        <div class="form-row">
            <div class="form-group">
                <label>שם לקוח / חברה</label>
                <input type="text" name="name" required placeholder='לדוגמה: פיטנס בוטיק בע"מ'>
            </div>
            <div class="form-group">
                <label>כינוי (לנושא האימייל)</label>
                <input type="text" name="nickname" placeholder='לדוגמה: נעים רמת גן'>
            </div>
        </div>
        <div class="form-row-3">
            <div class="form-group">
                <label>ע.מ / ת.ז</label>
                <input type="text" name="company_id" required placeholder="515877264">
            </div>
            <div class="form-group">
                <label>טלפון</label>
                <input type="text" name="phone" required placeholder="03-1234567">
            </div>
            <div class="form-group">
                <label>אימייל</label>
                <input type="email" name="email" placeholder="client@example.com">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">הוסף לקוח</button>
    </form>
</div>

<div class="card">
    <h2>לקוחות קיימים</h2>
    <div style="overflow-x:auto;">
    <table>
        <thead>
            <tr>
                <th>שם</th>
                <th>כינוי</th>
                <th>ע.מ / ת.ז</th>
                <th>טלפון</th>
                <th>אימייל</th>
                <th>פעיל</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <form method="POST" action="{{ url_for('edit_client', client_id=client.id) }}">
                    <td><input type="text" name="name" value="{{ client.name }}" class="table-input"></td>
                    <td><input type="text" name="nickname" value="{{ client.nickname or '' }}" class="table-input" placeholder="כינוי..."></td>
                    <td><input type="text" name="company_id" value="{{ client.company_id }}" class="table-input"></td>
                    <td><input type="text" name="phone" value="{{ client.phone }}" class="table-input"></td>
                    <td><input type="email" name="email" value="{{ client.email or '' }}" class="table-input" placeholder="email..."></td>
                    <td><input type="checkbox" name="active" {% if client.active %}checked{% endif %} style="width:18px; height:18px;"></td>
                    <td><button type="submit" class="btn btn-success btn-sm">שמור</button></td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>
</div>
{% endblock %}
